<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PDND E-Services Graph">
  <title>PDND E-Services Graph</title>
  <rect width="64" height="64" rx="10" fill="#0b5cad"/>
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <!-- Arco documentato: tratto continuo -->
    <line x1="24" y1="32" x2="46" y2="18" stroke-width="2.6" opacity=".95"/>
    <!-- Arco ricostruito: tratto lungo -->
    <line x1="24" y1="32" x2="47" y2="44" stroke-width="2.6" stroke-dasharray="7 3.5" opacity=".9"/>
    <!-- Arco inferito: punteggiato -->
    <line x1="24" y1="32" x2="30" y2="52" stroke-width="2.2" stroke-dasharray="2.5 3" opacity=".8"/>
  </g>
  <circle cx="24" cy="32" r="8.5" fill="#ffffff"/>
  <circle cx="46" cy="18" r="5" fill="#ffffff" opacity=".95"/>
  <circle cx="47" cy="44" r="5.5" fill="#ffffff" opacity=".9"/>
  <circle cx="30" cy="52" r="4" fill="#ffffff" opacity=".8"/>
</svg>
