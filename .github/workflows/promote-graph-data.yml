name: Promuovi anteprima a grafo live

# Sostituisce il grafo live (src/data/pdnd-data.json) con l'anteprima generata
# dalla pipeline. Azione DELIBERATA: solo manuale, con conferma esplicita.
# Apre una Pull Request verso main (branch protetto).

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: 'Scrivi PROMUOVI (in maiuscolo) per confermare'
        required: true
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica conferma
        run: |
          if [ "${{ github.event.inputs.conferma }}" != "PROMUOVI" ]; then
            echo "::error::Conferma non valida. Rilancia scrivendo esattamente PROMUOVI."
            exit 1
          fi

      - name: Verifica esistenza e validità dell'anteprima
        run: |
          if [ ! -f pipeline/pdnd-data.preview.json ]; then
            echo "::error::pipeline/pdnd-data.preview.json non trovato. Esegui prima l'aggiornamento."
            exit 1
          fi
          node -e '
            const d = require("./pipeline/pdnd-data.preview.json");
            if (!Array.isArray(d.enti) || !Array.isArray(d.eservices)) { console.error("::error::Anteprima malformata."); process.exit(1); }
            if (d.enti.length === 0 || d.eservices.length === 0) { console.error("::error::Anteprima vuota."); process.exit(1); }
            console.log(`Anteprima valida: ${d.enti.length} nodi, ${d.eservices.length} e-service`);
          '

      - name: Riepilogo del cambiamento
        run: |
          node -e '
            const fs = require("fs");
            const read = (p) => { try { return require(p); } catch { return {enti:[],eservices:[]}; } };
            const live = read("./src/data/pdnd-data.json");
            const prev = read("./pipeline/pdnd-data.preview.json");
            const out = ["## Promozione anteprima → grafo live","","| | Nodi | E-service |","|---|---|---|",
              `| Live attuale | ${live.enti.length} | ${live.eservices.length} |`,
              `| Anteprima (nuovo) | ${prev.enti.length} | ${prev.eservices.length} |`].join("\n");
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '

      - name: Backup, promozione e Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -f src/data/pdnd-data.json ]; then
            cp src/data/pdnd-data.json src/data/pdnd-data.curated-backup.json
          fi
          cp pipeline/pdnd-data.preview.json src/data/pdnd-data.json
          if git diff --quiet -- src/data/pdnd-data.json src/data/pdnd-data.curated-backup.json; then
            echo "Il grafo live era già allineato all'anteprima."
            exit 0
          fi
          BRANCH="automation/promote-live"
          git config user.name "pdnd-graph-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add src/data/pdnd-data.json src/data/pdnd-data.curated-backup.json
          git commit -m "chore: promozione anteprima a grafo live"
          git push -f -u origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null)" ]; then
            echo "PR di promozione già aperta: aggiornata."
          elif gh pr create --base main --head "$BRANCH" \
              --title "Promozione anteprima a grafo live" \
              --body "Sostituzione del grafo live con l'anteprima della pipeline. Backup del curato in \`src/data/pdnd-data.curated-backup.json\`. Rivedi e mergia per pubblicare." 2>/dev/null; then
            echo "Pull request di promozione creata."
          else
            echo "::warning::Creazione PR non consentita alle Actions. Branch pushato: aprila a mano qui:"
            echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
          fi
