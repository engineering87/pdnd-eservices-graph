name: Aggiornamento automatico grafo PDND

on:
  schedule:
    - cron: "0 4 1 * *"   # giorno 1 di ogni mese, 04:00 UTC
  workflow_dispatch: {}    # avvio manuale dalla tab Actions

permissions:
  contents: write
  pull-requests: write     # per aprire la PR (main è protetto)

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Inferenza AI via API Anthropic (Opus 4.8).
      INFERENCE_ENGINE: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-opus-4-8
      # GITHUB_TOKEN serve solo al passo gh (push branch + apertura PR), non all'inferenza.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INFERENCE_MIN_CONF: "0.6"
      INFERENCE_MAX_CALLS: "200"    # copre il backfill iniziale in un run; poi la cache fa il resto
      INFERENCE_DELAY_MS: "500"
      INFERENCE_MAX_RETRIES: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Genera anteprima aggiornata
        # Esce con codice 1 se un guard di validazione fallisce, interrompendo
        # il workflow PRIMA della PR. L'inferenza AI è fail-safe.
        run: node pipeline/build-graph-data.mjs --write

      - name: Apri Pull Request con l'anteprima
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Rileva sia modifiche sia file nuovi (git diff è cieco ai file non tracciati).
          if [ -z "$(git status --porcelain -- pipeline/pdnd-data.preview.json)" ]; then
            echo "Anteprima invariata: nessuna PR."
            exit 0
          fi
          BRANCH="automation/preview-update"
          git config user.name "pdnd-graph-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add pipeline/pdnd-data.preview.json pipeline/last-run-report.md pipeline/ai-cache.json
          git commit -m "chore: aggiornamento anteprima grafo PDND"
          git push -f -u origin "$BRANCH"
          # Apri la PR se non già aperta. Se l'organizzazione/repo non consente alle
          # Actions di creare PR, il branch resta pushato e viene stampato il link manuale.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null)" ]; then
            echo "PR già aperta per $BRANCH: aggiornata col nuovo commit."
          elif gh pr create --base main --head "$BRANCH" \
              --title "Aggiornamento anteprima grafo PDND" \
              --body "Aggiornamento automatico dell'anteprima (\`pipeline/pdnd-data.preview.json\`). Il grafo live non è toccato. Rivedi il report e mergia per versionare l'anteprima." 2>/dev/null; then
            echo "Pull request creata."
          else
            echo "::warning::Creazione PR non consentita alle Actions. Branch pushato: aprila a mano qui:"
            echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
          fi

      - name: Pubblica report nel riepilogo
        if: always()
        run: |
          if [ -f pipeline/last-run-report.md ]; then
            cat pipeline/last-run-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
