name: Aggiornamento automatico grafo PDND

on:
  schedule:
    - cron: "0 4 1 * *"   # giorno 1 di ogni mese, 04:00 UTC
  workflow_dispatch: {}    # avvio manuale dalla tab Actions

permissions:
  contents: write
  pull-requests: write     # per aprire la PR (main è protetto)

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Inferenza AI via GitHub Models: nessuna chiave esterna, usa il GITHUB_TOKEN.
      INFERENCE_ENGINE: github
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4.1
      INFERENCE_MIN_CONF: "0.6"
      INFERENCE_MAX_CALLS: "40"     # basso: il backfill grosso va fatto in locale (vedi README)
      INFERENCE_DELAY_MS: "2500"    # pausa tra chiamate per il rate limit del tier free
      INFERENCE_MAX_RETRIES: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Genera anteprima aggiornata
        # Esce con codice 1 se un guard di validazione fallisce, interrompendo
        # il workflow PRIMA della PR. L'inferenza AI è fail-safe.
        run: node pipeline/build-graph-data.mjs --write

      - name: Apri Pull Request con l'anteprima
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git diff --quiet -- pipeline/pdnd-data.preview.json; then
            echo "Anteprima invariata: nessuna PR."
            exit 0
          fi
          BRANCH="automation/preview-update"
          git config user.name "pdnd-graph-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add pipeline/pdnd-data.preview.json pipeline/last-run-report.md pipeline/ai-cache.json
          git commit -m "chore: aggiornamento anteprima grafo PDND"
          git push -f -u origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Aggiornamento anteprima grafo PDND" \
              --body "Aggiornamento automatico dell'anteprima (\`pipeline/pdnd-data.preview.json\`). Il grafo live non è toccato. Rivedi il report e mergia per versionare l'anteprima."
          else
            echo "PR già aperta per $BRANCH: aggiornata col nuovo commit."
          fi

      - name: Pubblica report nel riepilogo
        if: always()
        run: |
          if [ -f pipeline/last-run-report.md ]; then
            cat pipeline/last-run-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
